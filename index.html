<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>考试监控服务器</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Microsoft YaHei', Arial, sans-serif; background: #f0f4f8; color: #333; min-height: 100vh; }
    .header { background: #fff; padding: 25px; text-align: center; border-bottom: 2px solid #e3e8ee; }
    .header h1 { color: #4a90e2; font-size: 26px; margin-bottom: 10px; }
    .server-info { background: #f0f4f8; padding: 10px 18px; border-radius: 6px; display: inline-block; color: #5a6c7d; font-size: 14px; }
    .container { max-width: 1400px; margin: 30px auto; padding: 0 20px; }
    .clients-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
      gap: 20px; 
      margin-top: 20px;
    }
    .client-card {
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      transition: all 0.2s ease;
      border: 2px solid #e3e8ee;
      cursor: pointer;
    }
    .client-card:hover {
      border-color: #4a90e2;
      transform: translateY(-2px);
    }
    .client-card.online {
      border-color: #4a90e2;
    }
    .client-card.offline {
      border-color: #d0d5dd;
      opacity: 0.6;
    }
    .client-header {
      padding: 12px 15px;
      background: #f8fafc;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e3e8ee;
    }
    .client-id {
      font-weight: bold;
      font-size: 15px;
      color: #2d3748;
    }
    .status-badge {
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
    }
    .status-badge.online {
      background: #4a90e2;
      color: #fff;
    }
    .status-badge.offline {
      background: #a0aec0;
      color: #fff;
    }
    .screenshot-container {
      width: 100%;
      height: 200px;
      background: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .screenshot-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .waiting-text {
      color: #a0aec0;
      font-size: 14px;
      text-align: center;
    }
    .client-footer {
      padding: 10px 15px;
      background: #f8fafc;
      font-size: 12px;
      color: #718096;
      border-top: 1px solid #e3e8ee;
    }
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: #a0aec0;
    }
    .empty-state h3 {
      font-size: 20px;
      margin-bottom: 10px;
      color: #718096;
    }
    .empty-state p {
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>考试监控系统</h1>
    <div class="server-info" id="server-info">加载中...</div>
  </div>

  <div class="container">
    <div id="clients-grid" class="clients-grid">
      <!-- 客户端卡片将在这里显示 -->
    </div>
    <div id="empty-state" class="empty-state" style="display: none;">
      <h3>暂无客户端连接</h3>
      <p>等待考生上线...</p>
    </div>
  </div>

  <script>
    const serverInfoEl = document.getElementById('server-info');
    const clientsGridEl = document.getElementById('clients-grid');
    const emptyStateEl = document.getElementById('empty-state');
    const clientCards = new Map(); // 存储客户端卡片

    // 检查 electronAPI 是否可用
    if (!window.electronAPI) {
      console.error('electronAPI not available');
      serverInfoEl.innerHTML = '<span style="color: #ff6b6b;">⚠ electronAPI 未加载</span>';
    } else {
      console.log('electronAPI available');

      // 获取配置
      window.electronAPI.getConfig().then(cfg => {
        console.log('Config loaded:', cfg);
        window.appConfig = cfg;

        // 获取服务器信息
        window.electronAPI.getServerInfo().then(info => {
          console.log('Server info received:', info);
          serverInfoEl.innerHTML = `
            <strong>端口:</strong> ${info.port} | 
            <strong>IP:</strong> ${info.ips.join(', ')}
          `;
        }).catch(err => {
          console.error('Failed to get server info:', err);
          serverInfoEl.innerHTML = `<span style="color: #ff6b6b;">❌ 加载失败: ${err.message}</span>`;
        });

        // 监听新屏幕截图
        window.electronAPI.onNewScreenshot((data) => {
          updateClientScreenshot(data.clientId, data.imageData, data.timestamp);
        });

        // 定期更新客户端列表
        function updateClients() {
          fetch(`http://localhost:${window.appConfig.server.port}/clients`)
            .then(response => response.json())
            .then(clients => {
              renderClients(clients);
            })
            .catch(err => console.error('Failed to fetch clients:', err));
        }

        setInterval(updateClients, window.appConfig.clientList.refreshInterval);
        updateClients();
      }).catch(err => {
        console.error('Failed to load config:', err);
        serverInfoEl.innerHTML = `<span style="color: #ff6b6b;">❌ 配置加载失败: ${err.message}</span>`;
      });
    }

    // 渲染客户端网格
    function renderClients(clients) {
      if (clients.length === 0) {
        clientsGridEl.style.display = 'none';
        emptyStateEl.style.display = 'block';
        return;
      }

      clientsGridEl.style.display = 'grid';
      emptyStateEl.style.display = 'none';

      // 标记所有现有客户端为未更新
      const updatedClients = new Set();

      clients.forEach(client => {
        updatedClients.add(client.id);
        
        if (clientCards.has(client.id)) {
          // 更新现有卡片
          updateClientCard(client);
        } else {
          // 创建新卡片
          createClientCard(client);
        }
      });

      // 移除已离线的客户端卡片
      clientCards.forEach((card, clientId) => {
        if (!updatedClients.has(clientId)) {
          card.remove();
          clientCards.delete(clientId);
        }
      });
    }

    // 创建客户端卡片
    function createClientCard(client) {
      const card = document.createElement('div');
      card.className = `client-card ${client.status}`;
      card.dataset.clientId = client.id;

      const statusText = client.status === 'online' ? '在线' : '离线';
      const lastSeen = new Date(client.lastSeen).toLocaleString('zh-CN');

      card.innerHTML = `
        <div class="client-header">
          <span class="client-id">${client.id}</span>
          <span class="status-badge ${client.status}">${statusText}</span>
        </div>
        <div class="screenshot-container" id="screenshot-${client.id}">
          <div class="waiting-text">等待上线...</div>
        </div>
        <div class="client-footer">
          最后活跃: ${lastSeen}
        </div>
      `;

      // 点击卡片打开详情
      card.addEventListener('click', () => {
        window.electronAPI.openClientDetail(client.id);
      });

      clientsGridEl.appendChild(card);
      clientCards.set(client.id, card);
    }

    // 更新客户端卡片
    function updateClientCard(client) {
      const card = clientCards.get(client.id);
      if (!card) return;

      // 更新状态类
      card.className = `client-card ${client.status}`;

      // 更新状态徽章
      const statusBadge = card.querySelector('.status-badge');
      const statusText = client.status === 'online' ? '在线' : '离线';
      statusBadge.className = `status-badge ${client.status}`;
      statusBadge.textContent = statusText;

      // 更新时间
      const footer = card.querySelector('.client-footer');
      const lastSeen = new Date(client.lastSeen).toLocaleString('zh-CN');
      footer.textContent = `最后活跃: ${lastSeen}`;
    }

    // 更新客户端截图
    function updateClientScreenshot(clientId, imageData, timestamp) {
      const container = document.getElementById(`screenshot-${clientId}`);
      if (!container) return;

      // 清除等待文字
      container.innerHTML = '';

      // 添加或更新图片
      let img = container.querySelector('img');
      if (!img) {
        img = document.createElement('img');
        container.appendChild(img);
      }
      img.src = `data:image/png;base64,${imageData}`;

      // 更新卡片为在线状态
      const card = clientCards.get(clientId);
      if (card && !card.classList.contains('online')) {
        card.className = 'client-card online';
        const statusBadge = card.querySelector('.status-badge');
        statusBadge.className = 'status-badge online';
        statusBadge.textContent = '在线';
      }
    }
  </script>
</body>
</html>
